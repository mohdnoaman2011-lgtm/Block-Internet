name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the app code is the new version
        run: |
          if ! grep -rq "blocker/native" lib; then
            echo "::error::lib/main.dart is the OLD demo version. Upload main.dart again."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files (if missing)
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.example --project-name block_internet
          fi

      - name: Add native Android code and app icon
        run: |
          mkdir -p /tmp/native
          echo "" | base64 -d | tar xz -C /tmp/native
          D=android/app/src/main/kotlin/com/example/block_internet
          mkdir -p "$D"
          cp /tmp/native/*.kt "$D/"
          python3 /tmp/native/patch_manifest.py
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow
          python3 /tmp/native/make_icon.py

      - name: Install dependencies
        run: flutter pub get

      - name: Remove default generated test (it targets MyApp)
        run: |
          if grep -q "MyApp" test/widget_test.dart 2>/dev/null; then
            rm -f test/widget_test.dart
          fi

      - name: Analyze (does not block the build)
        continue-on-error: true
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: block-internet-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
